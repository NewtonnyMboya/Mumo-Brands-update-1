# Rebuild after payment-status correction e4a73e7
# Rebuild for adaptive dialogs and navigation fix d6a9378
name: Build Mumo Brands APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Extract uploaded Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q MumoBrandsAndroid-v1.1.1.zip -d source
          PROJECT_SETTINGS="$(find source -name settings.gradle.kts -print -quit)"
          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ZIP does not contain settings.gradle.kts"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project located at $PROJECT_DIR"
          APP_SOURCE="$(find "$PROJECT_DIR" -path '*/src/main/java/*/MainActivity.kt' -print -quit)"
          if [ -z "$APP_SOURCE" ]; then
            echo "Could not find app/src/main/java/.../MainActivity.kt in uploaded project"
            find "$PROJECT_DIR" -maxdepth 6 -type f | head -100
            exit 1
          fi
          cp MainActivity.kt "$APP_SOURCE"
          APP_MAIN_DIR="$(dirname "$APP_SOURCE")"
          while [ "$(basename "$APP_MAIN_DIR")" != "java" ]; do APP_MAIN_DIR="$(dirname "$APP_MAIN_DIR")"; done
          APP_MAIN_DIR="$(dirname "$APP_MAIN_DIR")"
          mkdir -p "$APP_MAIN_DIR/res/drawable"
          cp mumo_logo.xml "$APP_MAIN_DIR/res/drawable/mumo_logo.xml"
          echo "Updated application source and Mumo Brands logo drawable: $APP_MAIN_DIR"
      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mumo-Brands-debug-apk
          path: 'source/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
