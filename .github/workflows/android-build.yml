name: Build Mumo Brands APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Extract uploaded Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q MumoBrandsAndroid-v1.1.1.zip -d source
          PROJECT_SETTINGS="$(find source -name settings.gradle.kts -print -quit)"
          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ZIP does not contain settings.gradle.kts"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project located at $PROJECT_DIR"
      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mumo-Brands-debug-apk
          path: 'source/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
