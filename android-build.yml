name: Build Mumo Brands APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.MUMO_KEYSTORE_BASE64 != '' && secrets.MUMO_KEYSTORE_PASSWORD != '' && secrets.MUMO_KEY_ALIAS != '' && secrets.MUMO_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mumo-Brands-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Decode company release keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MUMO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mumo-release.jks"
      - name: Build signed production APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          MUMO_KEYSTORE_FILE: ${{ runner.temp }}/mumo-release.jks
          MUMO_KEYSTORE_PASSWORD: ${{ secrets.MUMO_KEYSTORE_PASSWORD }}
          MUMO_KEY_ALIAS: ${{ secrets.MUMO_KEY_ALIAS }}
          MUMO_KEY_PASSWORD: ${{ secrets.MUMO_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload signed production APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Mumo-Brands-production-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
